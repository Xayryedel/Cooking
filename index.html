<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éclat | Гастрономический опыт</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap');

:root{
  --bg:#0a0a0a;
  --text:#f5f5f5;
  --accent:#c5a059;
  --border:rgba(197,160,89,.3);
  --card:rgba(255,255,255,.03);
  --muted:#8a8a8a;
  --belt:#121212;
  --belt-side:#0b0b0b;
  --rail:rgba(197,160,89,.35);
  --island:#0e0e0e;
  --island-low:#090909;
  --island-wall:#171717;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background-color:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;overflow-x:hidden;min-height:100vh}

#canvas-container{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;opacity:.7;pointer-events:none}

header{position:fixed;top:0;left:0;right:0;padding:30px 50px;display:flex;justify-content:space-between;align-items:center;z-index:100;mix-blend-mode:difference}
.logo{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;letter-spacing:2px;color:var(--text)}
.nav-links{display:flex;gap:40px}
.nav-links a{color:var(--text);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:400;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:-5px;left:0;width:0;height:1px;background:var(--accent);transition:width .3s}
.nav-links a:hover::after{width:100%}

.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 20px;position:relative}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(60px,10vw,140px);font-weight:300;line-height:.9;margin-bottom:20px;letter-spacing:-2px;opacity:0;transform:translateY(50px)}
.hero p{font-size:14px;text-transform:uppercase;letter-spacing:5px;color:var(--accent);opacity:0;transform:translateY(30px)}

.belt-section{padding:120px 50px 160px;max-width:1400px;margin:0 auto;position:relative}
.section-title{font-family:'Cormorant Garamond',serif;font-size:48px;text-align:center;margin-bottom:18px;font-weight:400;position:relative}
.section-title::after{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:60px;height:1px;background:var(--accent)}
.section-sub{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:4px;color:var(--accent);margin-bottom:70px;opacity:.85}

.conveyor-wrap{position:relative;width:100%;isolation:isolate}
.conveyor-stage{position:relative;width:100%;touch-action:pan-y;user-select:none;overflow-x:clip}
.conveyor-belt{position:absolute;inset:0;pointer-events:none}
.conveyor-belt svg{position:absolute;left:0;top:0;overflow:visible}

.dish{position:absolute;left:0;top:0;padding:0;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;outline:none;border-radius:999px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:.3px;line-height:1;box-shadow:0 10px 24px -14px rgba(0,0,0,.9);transition:background .35s,border-color .35s,box-shadow .35s,color .35s;will-change:transform}
.dish .price{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:var(--muted);opacity:0;transition:opacity .35s;max-width:0;overflow:hidden}
.dish[data-active]{background:rgba(197,160,89,.10);border-color:rgba(197,160,89,.72);box-shadow:0 18px 36px -16px rgba(0,0,0,.95),0 0 0 1px rgba(197,160,89,.12),0 0 28px -6px rgba(197,160,89,.22)}
.dish[data-active] .price{opacity:1;max-width:120px}
.dish:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.dish .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.55;transition:opacity .35s}
.dish[data-active] .dot{opacity:1}

.belt-caption{min-height:3.25rem;text-align:center;margin-top:20px;padding:0 12px}
.belt-caption .name{font-weight:600;font-size:14px}
.belt-caption .price{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400;font-size:14px;margin-left:6px}
.belt-caption .desc{margin-top:2px;font-size:13px;line-height:1.45;color:var(--muted)}
.belt-caption .empty{font-size:14px;color:var(--muted)}

.belt-controls{display:flex;justify-content:center;gap:6px;margin-top:14px;position:relative;z-index:10}
.belt-controls button{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:.2s;outline:none}
.belt-controls button:hover{color:var(--accent);border-color:var(--accent)}
.belt-controls button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.belt-controls svg{width:14px;height:14px}

.dish-dialog{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.dish-dialog .backdrop{position:absolute;inset:0;background:rgba(5,5,5,.82);backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.dish-dialog.open .backdrop{opacity:1}
.dialog-card{position:relative;width:100%;max-width:46rem;display:grid;grid-template-columns:1fr;gap:24px;padding:28px;z-index:1}
.dialog-card .card-bg{position:absolute;inset:0;border-radius:28px;border:1px solid var(--border);background:rgba(15,15,15,.96);box-shadow:0 30px 80px rgba(0,0,0,.65);transform:scale(.97);opacity:0;transition:.35s}
.dish-dialog.open .card-bg{transform:scale(1);opacity:1}
.dialog-body{position:relative;display:flex;flex-direction:column;gap:12px;text-align:center;opacity:0;transform:translateY(8px);transition:.5s .12s}
.dish-dialog.open .dialog-body{opacity:1;transform:none}
.dialog-body .counter{font-family:'Montserrat',monospace;font-size:11px;letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.dialog-body .counter .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dialog-body h3{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;letter-spacing:-.5px;line-height:1.1}
.dialog-body .ddesc{font-size:14px;line-height:1.6;color:var(--muted)}
.dialog-body .details{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;list-style:none}
.dialog-body .details li{padding:4px 12px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.dialog-body .price-row{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px}
.dialog-body .price-row .dprice{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.dialog-body .add-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:999px;background:var(--accent);color:#0a0a0a;border:0;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;outline:none}
.dialog-body .add-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px var(--accent)}
.dialog-body .add-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dialog-body .add-btn svg{width:16px;height:16px}
.dialog-close{position:absolute;right:12px;top:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:transparent;border:0;color:var(--muted);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;opacity:0;outline:none}
.dish-dialog.open .dialog-close{opacity:1}
.dialog-close:hover{color:var(--accent)}
.dialog-close:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dialog-close svg{width:14px;height:14px}
@media(min-width:640px){
  .dialog-card{padding:36px}
  .dialog-body{text-align:left}
  .dialog-body .counter{justify-content:flex-start}
  .dialog-body .details,.dialog-body .price-row{justify-content:flex-start}
}

footer{text-align:center;padding:100px 20px;border-top:1px solid var(--border)}
.footer-logo{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:20px;color:var(--accent)}
.footer-text{font-size:12px;color:#555;text-transform:uppercase;letter-spacing:2px}

.device-selector{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .5s ease}
.device-selector.hidden{opacity:0;pointer-events:none}
.device-title{font-family:'Cormorant Garamond',serif;font-size:36px;margin-bottom:50px;color:var(--text);text-align:center}
.device-buttons{display:flex;gap:40px}
.device-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:30px 60px;font-family:'Montserrat',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:3px;cursor:pointer;transition:.3s;display:flex;flex-direction:column;align-items:center;gap:15px;outline:none}
.device-btn:hover{background:rgba(197,160,89,.1);border-color:var(--accent);transform:translateY(-5px)}
.device-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.device-icon{font-size:48px;color:var(--accent)}

@media(max-width:768px){
  header{padding:20px}
  .nav-links{display:none}
  .belt-section{padding:100px 20px}
  .section-title{font-size:32px}
  .device-buttons{flex-direction:column;gap:20px}
  .device-btn{padding:20px 40px}
}
</style>
</head>
<body>

<div class="device-selector" id="device-selector">
  <div class="device-title">Выберите устройство для просмотра</div>
  <div class="device-buttons">
    <button class="device-btn" onclick="selectDevice('pc')"><span class="device-icon">💻</span>Компьютер</button>
    <button class="device-btn" onclick="selectDevice('mobile')"><span class="device-icon">📱</span>Телефон</button>
  </div>
</div>

<div id="canvas-container"></div>

<header>
  <div class="logo">ÉCLAT</div>
  <div class="nav-links">
    <a href="#menu">Меню</a>
    <a href="#about">О нас</a>
    <a href="#contact">Контакты</a>
  </div>
</header>

<section class="hero">
  <h1>Искусство<br>вкуса</h1>
  <p>Гастрономический театр</p>
</section>

<section id="menu" class="belt-section">
  <h2 class="section-title">Дегустационное меню</h2>
  <p class="section-sub">Лента вкусов · наведите или коснитесь</p>
  <div class="conveyor-wrap" id="conveyor">
    <div class="conveyor-stage" id="stage" role="group" aria-label="Конвейер блюд" aria-roledescription="конвейер">
      <div class="conveyor-belt" id="belt" aria-hidden="true"></div>
    </div>
    <div class="belt-caption" id="caption" aria-live="polite"></div>
    <div class="belt-controls">
      <button type="button" id="btn-prev" aria-label="Предыдущее блюдо">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
      </button>
      <button type="button" id="btn-pause" aria-label="Пауза" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx=".8"/><rect x="9.4" y="3" width="2.6" height="10" rx=".8"/></svg>
      </button>
      <button type="button" id="btn-next" aria-label="Следующее блюдо">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
      </button>
    </div>
  </div>
</section>

<footer>
  <div class="footer-logo">ÉCLAT</div>
  <div class="footer-text">© 2026 Все права защищены</div>
</footer>

<script>
const DISHES = [
  { id:'tartar', name:'Тартар из тунца', price:'1 200 ₽', desc:'Свежий тунец, авокадо, цитрусовый соус, микрозелень и хрустящие чипсы из тапиоки.', details:['Закуска','Рыба'] },
  { id:'beef', name:'Томленая говядина', price:'2 400 ₽', desc:'Говяжья щека, томлённая 12 часов в красном вине, картофельное пюре с трюфелем.', details:['Основное','12 часов'] },
  { id:'pasta', name:'Черная паста', price:'1 800 ₽', desc:'Паста с чернилами каракатицы, гребешок, томаты черри, соус из белого вина.', details:['Основное','Морепродукты'] },
  { id:'fondant', name:'Шоколадный фондан', price:'800 ₽', desc:'Тёплый шоколадный фондан с жидким центром, шарик ванильного мороженого.', details:['Десерт','Шоколад'] },
];

const SPACING=1.35, CURVE=0.95, BAND=1.22, TILT=0.8, SLAT=0.34;
const LIFT_Y=-6, LIFT_SCALE=0.08, CHIP_ROOM=34, WIDE=1024, HOLD=1400;
const RUN=0, SEEK=1, DRAG=2;
const SPEED=18, INTERVAL=3000;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,'0');

const sim={offset:0,v:0,mode:RUN,target:0,lift:[],vlift:[],z:[],visible:true,raf:0,last:0,init:false,touched:false,l:0,center:-1,px:0,py:0,inside:false,lock:false,lockX:0,lockY:0};
let geo=null, active=null, paused=false, openIndex=null, playing=true;
let autoActive=null, autoLast=null, autoTimer=0;
let reduced=false, kb=0.68;
const pointer={id:-1,index:-1,x:0,y:0,moved:false,start:0,lane:1,lastX:0,lastT:0,v:0};
let pendingOpen=-1, returnFocus=null;

const stageEl=document.getElementById('stage');
const beltEl=document.getElementById('belt');
const captionEl=document.getElementById('caption');
const sectionEl=document.getElementById('conveyor');
const plateEls=[], liftEls=[], priceEls=[];
let seamPath=null, glintPath=null, svgEl=null;

try{ reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ reduced=false; }
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{ reduced=e.matches; kick(); });

function along(g,u){
  const {s,r,l}=g; let t=((u%l)+l)%l;
  if(t<s) return {x:s/2-t,z:r,nx:0,nz:1,tx:-1,tz:0};
  t-=s; const arc=Math.PI*r;
  if(t<arc){const f=t/r,sn=Math.sin(f),cs=Math.cos(f);return {x:-s/2-r*sn,z:r*cs,nx:-sn,nz:cs,tx:-cs,tz:-sn};}
  t-=arc;
  if(t<s) return {x:-s/2+t,z:-r,nx:0,nz:-1,tx:1,tz:0};
  t-=s; const f=Math.min(Math.PI,t/r),sn=Math.sin(f),cs=Math.cos(f);
  return {x:s/2+r*sn,z:-r*cs,nx:sn,nz:-cs,tx:cs,tz:sn};
}
function project(g,x,z){const k=g.a+g.b*z;return {x:g.cx+x*k,y:g.ym+TILT*(g.a*z+g.b*z*z/2),k};}
function makeGeo(width,n,d,kb){
  const l=Math.max(1,n)*SPACING*d;
  const r=Math.min(CURVE*d,l/(2*Math.PI));
  const s=Math.max(0,(l-2*Math.PI*r)/2);
  const g={width,height:0,d,r,s,l,pitch:l/Math.max(1,n),n:Math.max(1,n),kb,cx:width/2,ym:0,a:(1+kb)/2,b:(1-kb)/(2*r),band:BAND*d,slats:Math.max(10,Math.round(l/(SLAT*d))),side:Math.max(3,d*0.07),edgeTop:0};
  let top=Infinity,bottom=-Infinity,edge=Infinity;
  for(let j=0;j<120;j++){
    const p=along(g,(j/120)*l);
    const rim=project(g,p.x+p.nx*g.band/2,p.z+p.nz*g.band/2);
    const plate=project(g,p.x,p.z);
    const half=plate.k*d*TILT/2;
    edge=Math.min(edge,rim.y);
    top=Math.min(top,rim.y,plate.y+(LIFT_Y/100)*half*2-half*(1+LIFT_SCALE)-CHIP_ROOM);
    bottom=Math.max(bottom,rim.y+g.side+d*0.06,plate.y+half+d*0.08);
  }
  g.ym=Math.ceil(-top)+2;
  g.height=Math.ceil(bottom-top)+4;
  g.edgeTop=edge+g.ym;
  return g;
}
function halfSpan(g){
  let span=0;
  for(let j=0;j<120;j++){
    const p=along(g,(j/120)*g.l);
    const rim=project(g,p.x+p.nx*g.band/2,p.z+p.nz*g.band/2);
    const plate=project(g,p.x,p.z);
    span=Math.max(span,Math.abs(rim.x-g.cx)+3,Math.abs(plate.x-g.cx)+(plate.k*g.d*(1+LIFT_SCALE))/2);
  }
  return span;
}
function edgePath(g,offset){
  let d='';const steps=168;
  for(let j=0;j<steps;j++){
    const p=along(g,(j/steps)*g.l);
    const q=project(g,p.x+p.nx*offset,p.z+p.nz*offset);
    d+=`${j?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`;
  }
  return d+'Z';
}
function slatPath(g,offset,shift){
  const half=g.band*0.46,pitch=g.l/g.slats,bulge=pitch*0.2;
  let d='';
  for(let j=0;j<g.slats;j++){
    const p=along(g,offset+shift+j*pitch);
    const inner=project(g,p.x-p.nx*half,p.z-p.nz*half);
    const outer=project(g,p.x+p.nx*half,p.z+p.nz*half);
    const mid=project(g,p.x+p.tx*bulge,p.z+p.tz*bulge);
    d+=`M${inner.x.toFixed(1)} ${inner.y.toFixed(1)}Q${(2*mid.x-(inner.x+outer.x)/2).toFixed(1)} ${(2*mid.y-(inner.y+outer.y)/2).toFixed(1)} ${outer.x.toFixed(1)} ${outer.y.toFixed(1)}`;
  }
  return d;
}
function pose(g,offset,i){
  const p=along(g,offset-i*g.pitch);
  const q=project(g,p.x,p.z);
  return {x:q.x,y:q.y,k:q.k,depth:(p.z+g.r)/(2*g.r),angle:Math.atan2(p.tz,p.tx)};
}
function centerOf(g,offset){return ((Math.round((offset-g.s/2)/g.pitch)%g.n)+g.n)%g.n;}

function buildDOM(){
  stageEl.querySelectorAll('.dish').forEach(n=>n.remove());
  plateEls.length=0;liftEls.length=0;priceEls.length=0;
  DISHES.forEach((item,i)=>{
    const btn=document.createElement('button');
    btn.type='button';btn.className='dish';btn.dataset.dish=i;
    btn.setAttribute('aria-label',`${item.name}, ${item.price}`);
    btn.setAttribute('aria-haspopup','dialog');
    btn.innerHTML=`<span class="dot"></span><span class="name">${item.name}</span><span class="price">${item.price}</span>`;
    btn.addEventListener('focus',()=>{if(pointer.id<0){stopAuto();setActive(i);}});
    btn.addEventListener('click',e=>{
      if(e.detail===0){pendingOpen=-1;openDialog(i);}
      else if(pendingOpen===i){pendingOpen=-1;openDialog(i);}
      else pendingOpen=i;
    });
    stageEl.appendChild(btn);
    plateEls.push(btn);
    liftEls.push(btn);
    priceEls.push(btn.querySelector('.price'));
  });
}

function buildBeltSVG(){
  if(!geo)return;
  if(svgEl){svgEl.remove();}
  const ns='http://www.w3.org/2000/svg';
  svgEl=document.createElementNS(ns,'svg');
  svgEl.setAttribute('width',geo.width);svgEl.setAttribute('height',geo.height);
  svgEl.setAttribute('viewBox',`0 0 ${geo.width} ${geo.height}`);
  const uid='belt';
  svgEl.innerHTML=`
    <defs>
      <filter id="${uid}-soft" x="-10%" y="-30%" width="120%" height="160%">
        <feGaussianBlur stdDeviation="${(geo.d*0.06).toFixed(1)}"/>
      </filter>
      <linearGradient id="${uid}-island" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="var(--island)"/>
        <stop offset="1" stop-color="var(--island-low)"/>
      </linearGradient>
    </defs>
    <path id="${uid}-shadow" fill="black" opacity=".45" filter="url(#${uid}-soft)"/>
    <path id="${uid}-side" fill="var(--belt-side)"/>
    <path id="${uid}-top" fill="var(--belt)"/>
    <path id="${uid}-seam" fill="none" stroke="black" stroke-opacity=".18" stroke-width="${Math.max(1,geo.d*0.012)}" stroke-linecap="round"/>
    <path id="${uid}-glint" fill="none" stroke="white" stroke-opacity=".08" stroke-width="${Math.max(.8,geo.d*0.008)}" stroke-linecap="round"/>
    <path id="${uid}-rail-out" fill="none" stroke="var(--rail)" stroke-width="${Math.max(1.6,geo.d*0.018)}"/>
    <path id="${uid}-rail-in" fill="none" stroke="var(--rail)" stroke-width="${Math.max(1.4,geo.d*0.014)}"/>
    <path id="${uid}-island" fill="var(--island-wall)"/>
    <path id="${uid}-island-grad" fill="url(#${uid}-island)"/>
  `;
  beltEl.appendChild(svgEl);
  seamPath=svgEl.querySelector(`#${uid}-seam`);
  glintPath=svgEl.querySelector(`#${uid}-glint`);
  const paths={outer:edgePath(geo,geo.band/2),inner:edgePath(geo,-geo.band/2),island:edgePath(geo,-geo.band/2-geo.d*0.035)};
  const sh=svgEl.querySelector(`#${uid}-shadow`);
  sh.setAttribute('d',paths.outer);
  sh.setAttribute('transform',`translate(0 ${(geo.side+geo.d*0.07).toFixed(1)})`);
  const sideP=svgEl.querySelector(`#${uid}-side`);
  sideP.setAttribute('d',paths.outer+paths.inner);sideP.setAttribute('fill-rule','evenodd');
  sideP.setAttribute('transform',`translate(0 ${geo.side.toFixed(1)})`);
  const topP=svgEl.querySelector(`#${uid}-top`);
  topP.setAttribute('d',paths.outer+paths.inner);topP.setAttribute('fill-rule','evenodd');
  svgEl.querySelector(`#${uid}-rail-out`).setAttribute('d',paths.outer);
  svgEl.querySelector(`#${uid}-rail-in`).setAttribute('d',paths.inner);
  svgEl.querySelector(`#${uid}-island`).setAttribute('d',paths.island);
  const ig=svgEl.querySelector(`#${uid}-island-grad`);
  ig.setAttribute('d',paths.island);
  ig.setAttribute('transform',`translate(0 ${(-geo.side*0.6).toFixed(1)})`);
}

function measure(){
  const w=sectionEl.clientWidth||window.innerWidth;
  const wide=w>=WIDE, narrow=w>0&&w<480;
  kb=narrow?0.6:0.68;
  const stageW=stageEl.clientWidth||w;
  const span=halfSpan(makeGeo(1000,DISHES.length,100,kb))/100;
  const cap=wide?150:clamp(w*0.143,96,150);
  const fit=(stageW-8)/(2*span);
  geo=makeGeo(stageW,DISHES.length,Math.round(clamp(fit,Math.min(96,cap),cap)),kb);
  stageEl.style.height=geo.height+'px';
  buildBeltSVG();
  sim.z=[];sim.lift=sim.lift.slice(0,DISHES.length);sim.vlift=sim.vlift.slice(0,DISHES.length);
  while(sim.lift.length<DISHES.length){sim.lift.push(0);sim.vlift.push(0);}
  paintAll();kick();
}

function paintPlate(i){
  if(!geo)return;
  const btn=plateEls[i];if(!btn)return;
  const q=pose(geo,sim.offset,i);
  const e=clamp(sim.lift[i]??0,0,1.2);
  const w=btn.offsetWidth||120,h=btn.offsetHeight||32;
  const scale=q.k*(1+LIFT_SCALE*e);
  const tilt=Math.max(-8,Math.min(8,q.angle*57.2958*0.14));
  const x=q.x-w*scale/2;
  const y=q.y-h*scale/2+(LIFT_Y/100)*h*e*0.5;
  btn.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${tilt.toFixed(2)}deg) scale(${scale.toFixed(4)})`;
  const z=i===active?2000:100+Math.round(q.y);
  if(sim.z[i]!==z){sim.z[i]=z;btn.style.zIndex=String(z);}
  const dim=clamp(1-q.depth,0,1);
  btn.style.opacity=(1-0.55*dim*(1-0.7*clamp(e,0,1))).toFixed(3);
  btn.style.filter=dim>0.02?`brightness(${(1-0.35*dim).toFixed(3)})`:'';
}

function paintBelt(){
  if(!geo)return;
  if(seamPath)seamPath.setAttribute('d',slatPath(geo,sim.offset,0));
  if(glintPath)glintPath.setAttribute('d',slatPath(geo,sim.offset,-Math.max(1.4,geo.d*0.024)));
  const c=centerOf(geo,sim.offset);
  if(c!==sim.center){sim.center=c;}
  updateCaption();
}

function updateCaption(){
  if(active===null){
    captionEl.innerHTML=`<p class="empty">Наведите на блюдо или коснитесь его, чтобы узнать подробнее</p>`;
    return;
  }
  const item=DISHES[active];
  captionEl.innerHTML=`<p><span class="name">${item.name}</span><span class="price">· ${item.price}</span></p><p class="desc">${item.desc}</p>`;
}

function paintAll(){
  for(let i=0;i<DISHES.length;i++)paintPlate(i);
  paintBelt();
}

function hitTest(px,py){
  if(!geo)return null;
  let best=null,bestY=-Infinity;
  for(let i=0;i<DISHES.length;i++){
    const btn=plateEls[i];if(!btn)continue;
    const q=pose(geo,sim.offset,i);
    const e=clamp(sim.lift[i]??0,0,1.2);
    const w=(btn.offsetWidth||120)*q.k*(1+LIFT_SCALE*e)/2;
    const h=(btn.offsetHeight||32)*q.k*(1+LIFT_SCALE*e)/2;
    const cy=q.y+(LIFT_Y/100)*(btn.offsetHeight||32)*e*0.5;
    if(Math.abs(px-q.x)<=w+4&&Math.abs(py-cy)<=h+4){
      if(i===active)return i;
      if(q.y>bestY){best=i;bestY=q.y;}
    }
  }
  return best;
}

function tick(now){
  sim.raf=0;
  if(!geo||!sim.visible){sim.last=0;return;}
  const dt=sim.last?clamp((now-sim.last)/1000,0,0.25):1/60;
  sim.last=now;
  const steps=Math.max(1,Math.ceil(dt/0.017));
  const h=dt/steps;
  const stopped=paused||active!==null||openIndex!==null;
  const cruise=reduced?0:SPEED;
  for(let step=0;step<steps;step++){
    if(sim.mode===SEEK){
      const w=5.6;
      sim.v+=(w*w*(sim.target-sim.offset)-2*w*sim.v)*h;
      sim.offset+=sim.v*h;
      if(Math.abs(sim.target-sim.offset)<0.3&&Math.abs(sim.v)<4){sim.offset=sim.target;sim.v=0;sim.mode=RUN;}
    }else if(sim.mode===RUN){
      if(stopped){
        sim.v*=Math.exp(-7.2*h);
        if(Math.abs(sim.v)<0.02)sim.v=0;
      }else{
        let e=sim.v-cruise;
        if(Math.abs(e)>Math.max(6,cruise*0.5))e=Math.sign(e)*Math.max(0,Math.abs(e)*Math.exp(-2.4*h)-90*h);
        else e*=Math.exp(-3.4*h);
        sim.v=cruise+(Math.abs(e)<0.01?0:e);
      }
      sim.offset+=sim.v*h;
    }
    for(let i=0;i<DISHES.length;i++){
      const goal=i===active?1:0;
      if(reduced){sim.lift[i]=goal;sim.vlift[i]=0;continue;}
      const x=sim.lift[i]??0;
      const v=(sim.vlift[i]??0)+(330*(goal-x)-23*(sim.vlift[i]??0))*h;
      sim.lift[i]=x+v*h;
      sim.vlift[i]=v;
    }
  }
  let busy=sim.mode!==RUN||sim.v!==0||(!stopped&&cruise>0);
  for(let i=0;i<DISHES.length;i++){
    const goal=i===active?1:0;
    if(Math.abs(goal-(sim.lift[i]??0))<0.002&&Math.abs(sim.vlift[i]??0)<0.02){sim.lift[i]=goal;sim.vlift[i]=0;}
    else busy=true;
  }
  if(sim.inside&&!sim.lock&&sim.mode===RUN&&openIndex===null&&pointer.id<0&&Math.abs(sim.v)>0.3){
    const hit=hitTest(sim.px,sim.py);
    if(hit!==null&&hit!==active)hoverRef(hit);
  }
  paintAll();
  if(busy)sim.raf=requestAnimationFrame(tick);
  else sim.last=0;
}

function kick(){
  if(sim.raf||!sim.visible)return;
  sim.last=0;
  sim.raf=requestAnimationFrame(tick);
}

let hoverRef=()=>{};
hoverRef=(hit)=>{
  if(hit===active){
    if(hit!==null&&autoActive===hit){autoActive=null;playing=false;}
    return;
  }
  if(hit!==null){stopAuto();setActive(hit);return;}
  if(active!==null&&active!==autoActive&&!focusVisible())setActive(null);
};

function focusVisible(){return !!stageEl.querySelector('[data-dish]:focus-visible');}

function setActive(next){
  if(active===next)return;
  active=next;
  for(let i=0;i<plateEls.length;i++){
    const b=plateEls[i];if(!b)continue;
    if(i===active)b.setAttribute('data-active','');
    else b.removeAttribute('data-active');
  }
  updateCaption();
  kick();
}

function stopAuto(){
  playing=false;
  sim.touched=true;
  if(sim.mode===SEEK)sim.mode=RUN;
  if(autoActive!==null){
    const a=autoActive;autoActive=null;
    if(active===a)setActive(null);
  }
}

function seekTo(index){
  if(!geo)return;
  const base=geo.s/2+index*geo.pitch;
  sim.target=base+Math.round((sim.offset-base)/geo.l)*geo.l;
  if(reduced){sim.offset=sim.target;sim.v=0;sim.mode=RUN;paintAll();return;}
  sim.mode=SEEK;
  kick();
}

function go(index){
  if(!DISHES.length)return;
  const next=((index%DISHES.length)+DISHES.length)%DISHES.length;
  stopAuto();
  setActive(next);
  seekTo(next);
}

function togglePause(){
  stopAuto();
  paused=!paused;
  const btn=document.getElementById('btn-pause');
  btn.setAttribute('aria-pressed',String(paused));
  btn.innerHTML=paused
    ?'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.4v9.2a.6.6 0 0 0 .9.5l7.4-4.6a.6.6 0 0 0 0-1L5.9 2.9a.6.6 0 0 0-.9.5Z"/></svg>'
    :'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3" width="2.6" height="10" rx=".8"/><rect x="9.4" y="3" width="2.6" height="10" rx=".8"/></svg>';
  if(!paused&&active!==null&&!focusVisible()&&!sim.inside)setActive(null);
  kick();
}

function openDialog(i){
  stopAuto();
  setActive(i);
  sim.v=0;sim.mode=RUN;
  openIndex=i;
  paintBelt();
  buildDialog(i);
}

function closeDialog(){
  if(openIndex===null)return;
  openIndex=null;
  if(dialogEl){dialogEl.remove();dialogEl=null;}
  document.body.style.overflow='';
  if(returnFocus!==null){const i=returnFocus;returnFocus=null;plateEls[i]?.focus({preventScroll:true});}
  kick();
}

let dialogEl=null;
function buildDialog(i){
  closeDialogSilent();
  const item=DISHES[i];
  const src=plateEls[i]?.getBoundingClientRect()??null;
  document.body.style.overflow='hidden';
  const wrap=document.createElement('div');
  wrap.className='dish-dialog';
  wrap.setAttribute('role','dialog');
  wrap.setAttribute('aria-modal','true');
  wrap.setAttribute('aria-label',item.name);
  wrap.innerHTML=`
    <div class="backdrop"></div>
    <div class="dialog-card" tabindex="-1">
      <div class="card-bg"></div>
      <button type="button" class="dialog-close" aria-label="Закрыть">Закрыть <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
      <div class="dialog-body">
        <p class="counter"><span class="dot"></span>${pad(i+1)} / ${pad(DISHES.length)}</p>
        <h3>${item.name}</h3>
        <p class="ddesc">${item.desc}</p>
        <ul class="details">${item.details.map(d=>`<li>${d}</li>`).join('')}</ul>
        <div class="price-row">
          <p class="dprice">${item.price}</p>
          <button type="button" class="add-btn" data-add>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
            Добавить
          </button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  dialogEl=wrap;
  requestAnimationFrame(()=>wrap.classList.add('open'));
  const closeBtn=wrap.querySelector('.dialog-close');
  closeBtn.focus({preventScroll:true});
  const card=wrap.querySelector('.dialog-card');
  const fromRect=src;
  if(fromRect&&!reduced&&fromRect.width>0){
    const toRect=card.getBoundingClientRect();
    const sx=fromRect.width/toRect.width;
    const sy=fromRect.height/toRect.height;
    const dx=fromRect.left+fromRect.width/2-(toRect.left+toRect.width/2);
    const dy=fromRect.top+fromRect.height/2-(toRect.top+toRect.height/2);
    card.animate([
      {transform:`translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`,opacity:.4},
      {transform:'translate(0,0) scale(1)',opacity:1}
    ],{duration:520,easing:'cubic-bezier(.22,.85,.3,1)'});
  }
  wrap.querySelector('.backdrop').addEventListener('click',()=>{returnFocus=i;closeDialog();});
  closeBtn.addEventListener('click',()=>{returnFocus=i;closeDialog();});
  let added=false;
  wrap.querySelector('[data-add]').addEventListener('click',e=>{
    if(added)return;
    added=true;
    const btn=e.currentTarget;
    btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg> Добавлено';
    setTimeout(()=>{returnFocus=i;closeDialog();},reduced?0:420);
  });
  wrap.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();returnFocus=i;closeDialog();return;}
    if(e.key!=='Tab')return;
    const nodes=[...wrap.querySelectorAll('button')].filter(n=>!n.disabled);
    if(!nodes.length)return;
    const first=nodes[0],last=nodes[nodes.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  });
}

function closeDialogSilent(){
  if(dialogEl){dialogEl.remove();dialogEl=null;}
  document.body.style.overflow='';
}

function localPoint(event){
  const box=stageEl.getBoundingClientRect();
  return {x:event.clientX-box.left,y:event.clientY-box.top};
}

stageEl.addEventListener('pointerdown',event=>{
  if(event.button!==0||!geo)return;
  const at=localPoint(event);
  const hit=hitTest(at.x,at.y);
  pendingOpen=-1;
  pointer.id=event.pointerId;
  pointer.index=hit??-1;
  pointer.x=event.clientX;pointer.y=event.clientY;
  pointer.moved=false;
  pointer.start=sim.offset;
  pointer.lane=at.y>=geo.ym?1:-1;
  pointer.lastX=event.clientX;pointer.lastT=event.timeStamp;
  pointer.v=0;
});

stageEl.addEventListener('pointermove',event=>{
  if(!geo)return;
  const at=localPoint(event);
  if(event.pointerType==='mouse'){sim.px=at.x;sim.py=at.y;sim.inside=true;}
  if(pointer.id===event.pointerId){
    const dx=event.clientX-pointer.x;
    const now=event.timeStamp;
    if(!pointer.moved&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(event.clientY-pointer.y)){
      pointer.moved=true;
      stopAuto();
      setActive(null);
      sim.mode=DRAG;
      if(stageEl.isConnected)stageEl.setPointerCapture(event.pointerId);
    }
    if(pointer.moved){
      const v=(event.clientX-pointer.lastX)/Math.max(1,now-pointer.lastT);
      pointer.v=pointer.v*0.6+v*0.4;
      pointer.lastX=event.clientX;
      pointer.lastT=now;
      const scale=pointer.lane>0?1:1/geo.kb;
      sim.offset=pointer.start-pointer.lane*dx*scale;
      sim.v=reduced?0:-pointer.lane*pointer.v*1000*scale;
      kick();
    }
    return;
  }
  if(event.pointerType!=='mouse'||openIndex!==null)return;
  if(sim.lock){
    if(Math.hypot(at.x-sim.lockX,at.y-sim.lockY)<4)return;
    sim.lock=false;
  }
  hoverRef(hitTest(at.x,at.y));
});

function finishPointer(event,cancelled){
  if(pointer.id!==event.pointerId)return;
  if(stageEl.hasPointerCapture(event.pointerId))stageEl.releasePointerCapture(event.pointerId);
  pointer.id=-1;
  if(sim.mode===DRAG){
    sim.mode=RUN;
    const carry=Math.exp(-Math.max(0,event.timeStamp-pointer.lastT)/70);
    sim.v=reduced?0:clamp(sim.v*carry,-1400,1400);
    if(event.pointerType==='mouse'){
      const at=localPoint(event);
      sim.lock=true;sim.lockX=at.x;sim.lockY=at.y;
    }
    kick();
    return;
  }
  if(cancelled||pointer.moved)return;
  const touch=event.pointerType!=='mouse';
  if(pointer.index<0){
    if(touch&&active!==null){stopAuto();setActive(null);}
    return;
  }
  stopAuto();
  if(touch&&active!==pointer.index)setActive(pointer.index);
  else pendingOpen=pointer.index;
}

stageEl.addEventListener('pointerup',e=>finishPointer(e,false));
stageEl.addEventListener('pointercancel',e=>finishPointer(e,true));
stageEl.addEventListener('pointerleave',event=>{
  if(event.pointerType!=='mouse')return;
  sim.inside=false;sim.lock=false;
  if(pointer.id<0&&openIndex===null&&active!==null&&active!==autoActive&&!focusVisible())setActive(null);
});
stageEl.addEventListener('blur',event=>{
  const next=event.relatedTarget;
  if((next&&stageEl.contains(next))||openIndex!==null||sim.inside)return;
  if(active!==null&&active!==autoActive)setActive(null);
},true);

stageEl.addEventListener('keydown',event=>{
  if(!['ArrowRight','ArrowLeft','Home','End'].includes(event.key)||!DISHES.length)return;
  event.preventDefault();
  const own=event.target.closest('[data-dish]')?.getAttribute('data-dish');
  const from=own!=null?Number(own):(active??sim.center);
  go(event.key==='Home'?0:event.key==='End'?DISHES.length-1:from+(event.key==='ArrowRight'?1:-1));
});

document.getElementById('btn-prev').addEventListener('click',()=>go((active??sim.center)-1));
document.getElementById('btn-next').addEventListener('click',()=>go((active??sim.center)+1));
document.getElementById('btn-pause').addEventListener('click',togglePause);

function runAutoplay(){
  if(!playing||reduced||paused||openIndex!==null||!geo||!DISHES.length)return;
  const last=autoLast;
  const index=last===null?centerOf(geo,sim.offset+SPEED*0.25):(last+1)%DISHES.length;
  autoLast=index;
  autoActive=index;
  setActive(index);
  seekTo(index);
  autoTimer=window.setTimeout(()=>{
    if(autoActive===index){autoActive=null;if(active===index)setActive(null);}
    autoTimer=window.setTimeout(runAutoplay,Math.max(300,INTERVAL-HOLD));
  },HOLD);
}
function scheduleAutoplay(){
  window.clearTimeout(autoTimer);
  if(!playing||reduced||paused||openIndex!==null||!geo)return;
  autoTimer=window.setTimeout(()=>{
    runAutoplay();
  },autoLast===null?1600:Math.max(300,INTERVAL-HOLD));
}

document.addEventListener('visibilitychange',()=>{
  sim.visible=!document.hidden;
  if(sim.visible)kick();
  else if(sim.raf){cancelAnimationFrame(sim.raf);sim.raf=0;sim.last=0;}
});

if(typeof IntersectionObserver==='function'){
  const io=new IntersectionObserver(entries=>{
    const vis=entries.some(e=>e.isIntersecting)&&!document.hidden;
    if(vis!==sim.visible){
      sim.visible=vis;
      if(vis)kick();
      else if(sim.raf){cancelAnimationFrame(sim.raf);sim.raf=0;sim.last=0;}
    }
  },{threshold:0.1});
  io.observe(sectionEl);
}

new ResizeObserver(()=>{
  const oldL=sim.l;
  measure();
  if(oldL>0&&geo&&oldL!==geo.l){
    const f=geo.l/oldL;
    sim.offset*=f;sim.target*=f;
  }
}).observe(sectionEl);

document.addEventListener('pointermove',event=>{
  if(event.pointerType!=='mouse'||!geo)return;
  const box=stageEl.getBoundingClientRect();
  if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom){
    if(sim.inside){sim.inside=false;if(pointer.id<0&&openIndex===null&&active!==null&&active!==autoActive&&!focusVisible())setActive(null);}
  }
});

let scene, camera, renderer, mainObject, particlesMesh;
let isMobile = false;

function selectDevice(device) {
  isMobile = (device === 'mobile');
  document.getElementById('device-selector').classList.add('hidden');
  init3DScene();
  runAnimations();
}

function init3DScene() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const geometry = isMobile
    ? new THREE.IcosahedronGeometry(15, 1)
    : new THREE.TorusKnotGeometry(10, 3, 100, 16);

  const material = new THREE.MeshBasicMaterial({
    color: 0xc5a059,
    wireframe: true,
    transparent: true,
    opacity: 0.15
  });

  mainObject = new THREE.Mesh(geometry, material);
  scene.add(mainObject);

  const particlesGeo = new THREE.BufferGeometry();
  const particlesCount = isMobile ? 300 : 700;
  const posArray = new Float32Array(particlesCount * 3);

  for(let i = 0; i < particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * (isMobile ? 80 : 100);
  }

  particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const particlesMat = new THREE.PointsMaterial({
    size: isMobile ? 0.3 : 0.2,
    color: 0xc5a059,
    transparent: true,
    opacity: 0.8
  });

  particlesMesh = new THREE.Points(particlesGeo, particlesMat);
  scene.add(particlesMesh);

  camera.position.z = isMobile ? 40 : 30;

  const mouse = { x: 0, y: 0 };

  if (isMobile) {
    window.addEventListener('deviceorientation', (event) => {
      mouse.x = event.gamma / 45;
      mouse.y = event.beta / 45;
    });
  } else {
    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    });
  }

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();
    mainObject.rotation.x = elapsedTime * 0.1;
    mainObject.rotation.y = elapsedTime * 0.15;
    if (mouse.x !== undefined) {
      mainObject.rotation.x += (mouse.y || 0) * 0.05;
      mainObject.rotation.y += (mouse.x || 0) * 0.05;
    }
    particlesMesh.rotation.y = elapsedTime * 0.02;
    if (mouse.x !== undefined) {
      particlesMesh.rotation.x = (mouse.y || 0) * 0.1;
      particlesMesh.rotation.y += (mouse.x || 0) * 0.1;
    }
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function runAnimations() {
  gsap.to('.hero h1', { opacity: 1, y: 0, duration: 1.5, ease: 'power3.out', delay: 0.2 });
  gsap.to('.hero p', { opacity: 1, y: 0, duration: 1.5, ease: 'power3.out', delay: 0.6 });

  buildDOM();
  measure();
  updateCaption();
  sim.offset = geo ? geo.s/2 - Math.min(SPEED*1.62, geo.pitch*0.45) : 0;
  sim.v = reduced || paused ? 0 : SPEED;
  sim.l = geo ? geo.l : 0;
  sim.init = true;
  paintAll();
  kick();
  scheduleAutoplay();
}
</script>
